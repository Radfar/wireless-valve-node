; PlatformIO configuration for the current full-size WEMOS D1 (ESP8266)
[env:d1]
platform = espressif8266
board = d1
framework = arduino

; Build only the RF valve-node application.
; src/main.cpp is a separate MQTT soil-moisture experiment and also defines
; setup()/loop(), so it must not be compiled into the same firmware image.
build_src_filter =
  +<rf.cpp>
  -<main.cpp>

lib_deps =
  sui77/rc-switch

upload_protocol = esptool
; Uncomment and adjust if automatic port detection fails:
; upload_port = COM5

monitor_speed = 9600

